name: Hula GitHub release

on:
  push:
    tags:
      - 'v*-hula.*'

concurrency:
  group: hula-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'hulaearth/deck.gl'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      RENDER_TEST_DEVICE: webgl

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install dependencies and browser
        run: |
          corepack enable yarn
          yarn --frozen-lockfile
          yarn playwright install --with-deps chromium

      - name: Build all packages and browser bundles
        run: |
          yarn build
          yarn lerna run prepublishOnly --concurrency 1

      - name: Check lint and Node tests
        run: |
          yarn test-fast
          node --test scripts/pack-github-release.test.mjs

      - name: Check MapLibre integration and icon rendering
        run: |
          yarn test-headless --reporter=dot test/modules/maplibre test/modules/mapbox
          yarn test-render --reporter=dot test/render/test-cases/icon-layer.spec.ts test/render/test-cases/text-layer.spec.ts

      - name: Verify npm installation and Vite builds
        run: node scripts/test-github-release.mjs "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"

      - name: Pack release assets
        run: node scripts/pack-github-release.mjs "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > /tmp/hula-release.json; then
            node -e 'if (!JSON.parse(require("fs").readFileSync("/tmp/hula-release.json")).isDraft) throw Error("Published releases are immutable; use a new tag")'
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "deck.gl $GITHUB_REF_NAME" \
              --notes-file dist/github-release/release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber \
            dist/github-release/*.tgz \
            dist/github-release/dependencies.json \
            dist/github-release/SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" \
            --notes-file dist/github-release/release-notes.md --draft=false
